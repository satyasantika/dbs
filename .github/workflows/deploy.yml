name: Deploy dbs
on:
  push:
    branches: [ main ]

# Deploy tidak boleh dibatalkan di tengah jalan (composer install, build aset, migrasi).
concurrency:
  group: deploy-dbs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Gagal di sini belum memerahkan job; percobaan kedua di bawah yang menentukan.
      # Penyebab umum: "dial tcp :22: i/o timeout" dari runner ke server (server sehat).
      # flock -w 900: bila percobaan pertama sempat jalan di server, percobaan ini
      # menunggu sampai selesai lalu menjalankan ulang. ~/docker-apps/deploy.sh aman
      # diulang (git pull, composer install, npm ci/build, migrate --force), dan
      # kunci mencegah dua rilis berjalan bersamaan karena skripnya sendiri tanpa kunci.
      - name: Deploy ke server via SSH
        id: rilis
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            flock -w 900 /tmp/deploy-dbs.lock ~/docker-apps/deploy.sh dbs

      - name: Deploy ke server via SSH (percobaan 2)
        if: steps.rilis.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            flock -w 900 /tmp/deploy-dbs.lock ~/docker-apps/deploy.sh dbs
